name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and package
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "C:\t"
          python tools/package_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: kirikae-windows-x64
          path: dist/*.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Download

            The **windows-x64** zip below holds:

            - `kirikae-gui.exe`: pick a game dump, press **Recompile**.
            - `kirikae.exe`: the command line tool (`kirikae build game.dnsp -o out`).
            - `runtime/`: the runtime sources every game is compiled against. Keep it next to the executables.

            ## Requirements

            - Windows 10/11 x64 and a GPU with Vulkan 1.3.
            - [Rust](https://rustup.rs) and the MSVC build tools (*Desktop development with C++*): games are compiled on your machine.
            - A **decrypted** dump of a game you own (`.dnsp`, an extracted ExeFS folder, `.nso` or `.nro`).

            > Only use games dumped from your own console, and never share the executables Kirikae generates. See [LEGAL.md](https://github.com/Cor3Duo/kirikae/blob/main/LEGAL.md).
