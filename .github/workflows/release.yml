name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and package
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "C:\t"
          python tools/package_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: kirikae-windows-x64
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Build and package
        run: python tools/package_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: kirikae-linux-x64
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            The **windows-x64** zip and the **linux-x64** tarball each hold:

            - `kirikae-gui` (`kirikae-gui.exe` on Windows): pick a game dump, press **Recompile**.
            - `kirikae` (`kirikae.exe`): the command line tool (`kirikae build game.dnsp -o out`).
            - `runtime/`: the runtime sources every game is compiled against. Keep it next to the executables.

            ## Requirements

            - A GPU with Vulkan 1.3.
            - Windows 10/11 x64: [Rust](https://rustup.rs) and the MSVC build tools (*Desktop development with C++*).
            - Linux x64 (glibc 2.35 or newer, X11 or Wayland): [Rust](https://rustup.rs), a C toolchain and the ALSA and udev headers, see the README.
            - Games are compiled on your machine.
            - A **decrypted** dump of a game you own (`.dnsp`, an extracted ExeFS folder, `.nso` or `.nro`).

            > Only use games dumped from your own console, and never share the executables Kirikae generates. See [LEGAL.md](https://github.com/Cor3Duo/kirikae/blob/main/LEGAL.md).
