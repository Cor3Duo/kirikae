name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --release --workspace -- --skip register_operands
