[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cor3Duo/kirikae"

[workspace.dependencies]
kirikae-a64 = { path = "crates/a64" }
kirikae-loader = { path = "crates/loader" }
kirikae-maxwell = { path = "crates/maxwell" }
kirikae-rt = { path = "crates/rt" }
kirikae-recomp = { path = "crates/recomp" }
kirikae-testkit = { path = "crates/testkit" }

[profile.release]
opt-level = 3
